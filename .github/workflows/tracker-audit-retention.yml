name: Tracker audit retention

on:
  pull_request:
    paths:
      - '.github/workflows/tracker-audit-retention.yml'
      - 'tracker/audit*.py'
      - 'docs/portfolio/audit-evidence/**'
  workflow_dispatch:
  schedule:
    - cron: '23 15 1 * *'

permissions:
  actions: read
  contents: read

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Reperform retained archives and check source metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tracker.audit_retention --output tracker-retention.json
      - uses: actions/upload-artifact@v4
        with:
          name: tracker-retention
          path: tracker-retention.json
          if-no-files-found: error
          retention-days: 90
