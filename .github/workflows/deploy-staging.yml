name: Plan or deploy existing ECS staging service
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [plan, deploy]
        default: plan
        required: true
      image:
        description: Immutable ECR repository@sha256 digest already published
        type: string
        required: true
      approved_plan_sha:
        description: SHA256 from a reviewed plan artifact; required to deploy
        type: string
        required: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: portfolio-staging-deployment
  cancel-in-progress: false
jobs:
  staging:
    if: github.ref == 'refs/heads/main'
    environment: portfolio-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      CLUSTER: ${{ vars.ECS_CLUSTER_ARN }}
      SERVICE: ${{ vars.ECS_SERVICE_ARN }}
      CONTAINER: ${{ vars.ECS_CONTAINER }}
      REPOSITORY: ${{ vars.ECR_REPOSITORY_URI }}
      PREVIOUS: ${{ vars.ECS_PREVIOUS_TASK_DEFINITION }}
      TASK_ROLE: ${{ vars.ECS_TASK_ROLE_ARN }}
      EXECUTION_ROLE: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
      IMAGE: ${{ inputs.image }}
      ACTION: ${{ inputs.action }}
      APPROVED_SHA: ${{ inputs.approved_plan_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Validate target and write configuration without shell interpolation
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          mapping=dict(account="EXPECTED_ACCOUNT",region="AWS_REGION",cluster="CLUSTER",service="SERVICE",container="CONTAINER",repository="REPOSITORY",image="IMAGE",expected_previous="PREVIOUS",task_role_arn="TASK_ROLE",execution_role_arn="EXECUTION_ROLE")
          config={k:os.environ[v] for k,v in mapping.items()}
          if not all(config.values()): raise SystemExit("Configure all portfolio-staging variables before running")
          expected=f"{config['account']}.dkr.ecr.{config['region']}.amazonaws.com/"
          if not config["repository"].startswith(expected) or not re.fullmatch(re.escape(config["repository"])+r"@sha256:[0-9a-f]{64}",config["image"]): raise SystemExit("Invalid immutable ECR image")
          Path("deployment-config.json").write_text(json.dumps(config))
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Authenticate to expected ECR registry
        run: |
          registry="${EXPECTED_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
      - uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          version: v0.76.2
          image-ref: ${{ inputs.image }}
          format: json
          output: deployment-scan.json
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "1"
      - name: Plan or apply exact approved plan
        run: |
          if [ "$ACTION" = deploy ]; then
            python -m tower.deploy --config deployment-config.json --output deployment-result.json --execute --approved-plan-sha "$APPROVED_SHA"
          else
            python -m tower.deploy --config deployment-config.json --output deployment-result.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-deployment-evidence
          path: |
            deployment-result.json
            deployment-scan.json
          retention-days: 30
