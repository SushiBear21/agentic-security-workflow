name: Portfolio extension evidence
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "34 12 * * *"
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python p4_regression.py --output regression.json
      - run: python -m tower.release --output release-evidence
      - run: python -m tower.governance release-evidence
      - name: Build container and run isolated rehearsal
        run: |
          docker build -t portfolio-rehearsal .
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m portfolio-rehearsal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-extension-evidence
          path: |
            regression.json
            release-evidence/
          retention-days: 14
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements.txt --format json --output dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
          retention-days: 14
