name: Agent security tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check syntax
        run: python -m compileall -q app tower tests

      - name: Run security tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Exercise tracker operating controls
        run: python -m tracker.operating_evidence --output tracker-operating-evidence.json

      - name: Reperform tracker audit evidence
        run: python -m tracker.audit_workpapers --output tracker-audit-packet.json

      - name: Evaluate simulated SaaS audit period
        run: python -m tracker.saas_audit --output saas-audit-packet.json

      - name: Retain tracker audit packet
        uses: actions/upload-artifact@v4
        with:
          name: tracker-audit-packet
          path: tracker-audit-packet.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain simulated SaaS audit packet
        uses: actions/upload-artifact@v4
        with:
          name: saas-audit-packet
          path: saas-audit-packet.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain tracker operating evidence
        id: operating-evidence
        uses: actions/upload-artifact@v4
        with:
          name: tracker-operating-evidence
          path: tracker-operating-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Download the uploaded receipt for verification
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.operating-evidence.outputs.artifact-id }}
          path: downloaded-operating-evidence
          merge-multiple: true

      - name: Verify downloaded bytes and publish a text copy
        run: |
          cmp tracker-operating-evidence.json downloaded-operating-evidence/tracker-operating-evidence.json
          sha256sum downloaded-operating-evidence/tracker-operating-evidence.json
          echo 'TRACKER_RECEIPT_BASE64_BEGIN'
          base64 -w 120 downloaded-operating-evidence/tracker-operating-evidence.json
          echo 'TRACKER_RECEIPT_BASE64_END'
